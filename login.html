<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie – Panel Gier</title>
    <!-- Biblioteka Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Logowanie do Systemu</h2>
    <form id="login-form">
        <input type="email" id="email" placeholder="E-mail" required><br><br>
        <input type="password" id="password" placeholder="Hasło" required><br><br>
        <button type="submit">Zaloguj</button>
    </form>
    <p id="error-message" style="color: red;"></p>
<p>Nie masz konta? <a href="register.html">Zarejestruj się</a></p>
    <script>
        // Inicjalizacja Supabase
        const supabaseUrl = 'TWÓJ_PROJECT_URL';
        const supabaseKey = 'TWÓJ_PROJECT_ANON_KEY';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                document.getElementById('error-message').textContent = 'Błąd logowania: ' + error.message;
            } else {
                // Po udanym logowaniu przekierowuje do głównego huba
                window.location.href = 'hub.html';
            }
        });
    </script>
</body>
</html>
