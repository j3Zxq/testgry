<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja – Panel Gier</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Rejestracja Konta</h2>
    <form id="register-form">
        <input type="email" id="reg-email" placeholder="E-mail" required><br><br>
        <input type="password" id="reg-password" placeholder="Hasło (min. 6 znaków)" required><br><br>
        <button type="submit">Zarejestruj się</button>
    </form>
    <p id="reg-message" style="color: green;"></p>
    <p>Masz już konto? <a href="login.html">Zaloguj się</a></p>

    <script>
        const supabaseUrl = 'TWÓJ_PROJECT_URL';
        const supabaseKey = 'TWÓJ_PROJECT_ANON_KEY';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const { data, error } = await _supabase.auth.signUp({
                email: email,
                password: password,
            });

            const msgElement = document.getElementById('reg-message');
            if (error) {
                msgElement.style.color = 'red';
                msgElement.textContent = 'Błąd rejestracji: ' + error.message;
            } else {
                msgElement.style.color = 'green';
                msgElement.textContent = 'Konto utworzone! Możesz się teraz zalogować.';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        });
    </script>
</body>
</html>
