    <link rel="icon" type="image/png" sizes="32x32" href="akatsuki_logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --black: #0a0a0a; --black2: #111111; --black3: #1a1a1a; --red: #8b0000; --red2: #b30000; --red3: #cc1a1a; --coal: #2a2a2a; --coal2: #383838; --text: #e8e8e8; --muted: rgba(232,232,232,0.38); --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.12); }
        html, body { height: 100%; background: var(--black); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }
        body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events: none; z-index: 9999; opacity: 0.5; }
        body::after { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px); pointer-events: none; z-index: 9998; }
        .bg-watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 45vw; max-width: 600px; opacity: 0.08; pointer-events: none; z-index: 0; }
        .hub { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 22px 40px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10; }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-logo { width: 36px; height: 36px; filter: drop-shadow(0 0 10px rgba(180,0,0,0.5)); }
        .brand-name { font-family: 'Orbitron', monospace; font-size: 1.6em; font-weight: 900; letter-spacing: 8px; color: var(--text); }
        .brand-name span { color: var(--red2); }
        .brand-sub { font-family: 'Rajdhani', sans-serif; font-size: 0.7em; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; }
        .header-right { display: flex; align-items: center; gap: 20px; font-family: 'Rajdhani', sans-serif; font-size: 0.75em; color: var(--muted); }
        .logout-btn { cursor: pointer; background: var(--red); color: white; border: none; padding: 5px 10px; border-radius: 4px; font-family: 'Rajdhani'; }
        .carousel-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; background: rgba(26,26,26,0.9); border: 1px solid var(--border2); color: var(--muted); cursor: pointer; z-index: 20; clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%); }
        .arrow-left { left: 40px; } .arrow-right { right: 40px; clip-path: polygon(0% 0%, 90% 0%, 100% 100%, 10% 100%); }
        .card-track { position: relative; width: 100%; }
        .card { position: absolute; top: 50%; left: 50%; width: 420px; height: 500px; cursor: pointer; transition: transform 0.55s; }
        .card-inner { width: 100%; height: 100%; background: var(--black2); border: 1px solid var(--border); display: flex; flex-direction: column; }
        .dots { display: flex; justify-content: center; gap: 8px; padding: 0 0 28px; }
        .dot { width: 6px; height: 6px; background: var(--coal2); border-radius: 1px; }
        .dot.active { background: var(--red2); width: 24px; }
        .progress-bar { height: 1px; background: var(--border); margin: 0 40px; }
        .progress-fill { height: 1px; background: var(--red); transition: width 0.55s; }
    </style>
</head>
<body>

<div class="hub">
  <header class="header">

      <span id="clock">00:00:00</span>

  </header>
  <div class="carousel-area">
    <button class="arrow arrow-left" onclick="navClick(-1)">&#8592;</button>

    <button class="arrow arrow-right" onclick="navClick(1)">&#8594;</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
</div>
